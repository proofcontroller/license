[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-license"
version = "1.0.0"
description = "Proof Controller license server (operator side)"
requires-python = ">=3.11"
authors = [{ name = "Craig Ellrod" }]
license = { text = "GGL-C-1.0" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
proof-license = "proof_license.cli:main"

[tool.setuptools]
packages = ["proof_license"]
